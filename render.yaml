services:
  - type: web
    name: benom-operations-hub
    runtime: node
    plan: free
    rootDir: app
    buildCommand: npm install --include=dev && npm run build
    startCommand: node server/index.mjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_SECRET
        generateValue: true
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
